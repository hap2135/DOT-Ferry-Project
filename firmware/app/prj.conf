# Console on uart0 (USB COM port via the on-board RP2040), 115200 8N1.
# Logs also go to SEGGER RTT (read with `probe-rs attach`) as a backup.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# GPIO for the on-board LED
CONFIG_GPIO=y
