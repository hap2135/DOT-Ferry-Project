# Build MCUboot alongside the app. The board's static partition map
# (forced by the board's sysbuild.cmake: mcuboot at 0x0, image at 0x10000)
# requires a bootloader; without one the app never boots.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# No signing key: MCUboot only checks the image hash, not a signature.
# Switch to a real signature type + key before shipping OTA updates.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
